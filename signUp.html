<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GymHub Registration</title>
  <link rel="stylesheet" href="/cssFiles/signUp.css">
</head>
<body>

  <div class="container">
    <div class="top-line"></div>

    <div class="logo">GH</div>

    <h1>Create Account</h1>
    <p class="subtitle">
      Join GymHub and manage your fitness dashboard with a modern neon experience.
    </p>

    <form>
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" placeholder="Enter your full name" required />
      </div>

      <div class="row">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" placeholder="example@mail.com" required />
        </div>

        <div class="form-group">
          <label>Phone Number</label>
          <input type="tel" placeholder="9876543210" required />
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label>Age</label>
          <input type="number" placeholder="21" required />
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" placeholder="••••••••" required />
        </div>
      </div>

      <a href="/htmlFiles/overview.html" class="btn">Sign Up</a>
    </form>

    <div class="divider">Already have an account?</div>

    <button class="login-btn">Login</button>

    <div class="footer">
      GymHub Neon UI • Responsive Registration Form<br>
      Dark Theme • Modern CSS • Mobile Friendly
    </div>
  </div>

</body>
</html>
